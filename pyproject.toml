[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twitter-bot-detection"
version = "0.1.0"
description = "Library utilities for TwiBot-20 bot detection pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "seaborn",
  "tqdm",
  "scikit-learn",
  "shap",
  "toolz"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
